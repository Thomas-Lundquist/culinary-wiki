site_name: Skyline Culinary Wiki
site_description: A wiki for the Skyline Culinary program
theme:
  name: materialx
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs        # Top-level tabs: Core | Food & Nutrition | Culinary 1 | Culinary 2
    - navigation.tabs.sticky # Tab bar stays pinned to the header while scrolling
    - navigation.indexes     # Section landing pages (index.md) are clickable as the section
    - navigation.instant     # SPA-style instant page loads
    - navigation.top         # "Back to top" button on scroll
    - toc.integrate          # Fold the right-hand "On this page" TOC into the left sidebar
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  generator: false   # Hide the "Made with Material for MkDocs" footer notice

markdown_extensions:
  - admonition            # Renders the `!!! tip` blocks the callouts plugin emits
  - pymdownx.details      # Collapsible callouts (`> [!note]-`)
  - pymdownx.superfences  # Nested code/content inside callouts; Material standard

plugins:
  - material/search   # materialx's header only renders the search UI for this plugin key, not plain `search`
  - tags
  - awesome-pages
  - glightbox
  - document-dates:
      show_author: false
  - callouts
  - exclude:
      glob:
        - drafts/*
        - _templates/*
        - .obsidian/*   # Obsidian vault config — keep editor files out of the public site
  - redirects:
      redirect_maps:
        'culinary-1/yeast-breads.md': 'culinary-1/yeast-breads/index.md'
  - exporter:
      theme:
        name: material   # materialx is a material-compatible fork; use the material handler
      formats:
        pdf:
          enabled: !ENV [ENABLE_PDF, false]   # off unless ENABLE_PDF=true — keeps serve/build fast
      buttons:
        - title: Download as PDF
          icon: material-file-download-outline
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes

extra_css:
  - assets/stylesheets/extra.css