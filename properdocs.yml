site_name: Culinary Program Wiki
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs        # Top-level tabs: Core | Food & Nutrition | Culinary 1 | Culinary 2
    - navigation.sections
    - navigation.indexes     # Section landing pages (index.md) are clickable as the section
    - navigation.instant     # SPA-style instant page loads
    - navigation.top         # "Back to top" button on scroll
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition            # Renders the `!!! tip` blocks the callouts plugin emits
  - pymdownx.details      # Collapsible callouts (`> [!note]-`)
  - pymdownx.superfences  # Nested code/content inside callouts; Material standard

plugins:
  - search
  - tags
  - awesome-pages
  - glightbox
  - git-revision-date-localized:
      type: date
      enabled: !ENV [GIT_DATES, true]   # set GIT_DATES=false to skip per-file git calls during dev serve
      fallback_to_build_date: true      # silence "no git logs" warnings for uncommitted pages
  - macros
  - callouts
  - exclude:
      glob:
        - drafts/*
        - _templates/*
  - redirects:
      redirect_maps:
        # 'old/path.md': 'new/path.md'   # add mappings when you move/rename a page
  - print-site

extra_css:
  - assets/stylesheets/extra.css