site_name: Culinary Program Wiki
theme:
  name: material
  features:
    - navigation.tabs        # Top-level tabs: Core | Food & Nutrition | Culinary 1 | Culinary 2
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default

nav:
  - Home: index.md
  - Core Skills: core/
  - Food & Nutrition: food-nutrition/
  - Culinary 1: culinary-1/
  - Culinary 2: culinary-2/
  - Glossary: glossary.md

plugins:
  - search
  - tags
  - awesome-pages
  - glightbox
  - git-revision-date-localized:
      type: date
  - print-site
  - macros
  - callouts
  - exclude:
      glob:
        - drafts/*